#
# CI INVARIANTS
#   - If you rename this workflow's `name:` or any `job:` key below, you MUST
#     update the branch protection ruleset's required-status-checks list to
#     match (see docs/BRANCH_PROTECTION.md). Otherwise PRs will block forever
#     waiting on phantom check contexts.
#   - NEVER change `-p ncp-runtime` to `--workspace` in the host jobs. The
#     brick crates are #![no_std] + core::arch::wasm32::* and cannot compile
#     for host targets.

name: Rust

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write   # required by Swatinem/rust-cache@v2 (writes to GitHub cache service)

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ──────────────────────────────────────────────────────────────────────
# HOST JOBS (fmt, clippy, test): build runtime crate on host triples.
# NEVER change `-p ncp-runtime` to `--workspace` — the brick crates are
# #![no_std] + core::arch::wasm32::* and cannot compile for host targets.
# ──────────────────────────────────────────────────────────────────────
jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    # Host-only lint scope: WASM crates linted in wasm-build job (different target).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with: { key: clippy }
      - run: cargo clippy -p ncp-runtime --all-targets --locked -- -D warnings

  test:
    # Host-only crate scope: -p ncp-runtime avoids attempting to compile
    # the WASM-only brick crates (no_std + wasm32 intrinsics).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25   # Windows runners are consistently slowest; one bound covers all OSes safely.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test -p ncp-runtime --all-targets --locked

  # ──────────────────────────────────────────────────────────────────────
  # MCP SMOKE JOB: build the ncp-mcp-server release binary and drive it
  # through a real MCP stdio dialog against the echo-pipeline example
  # graph. Validates the adopter path end-to-end with a stdlib-only
  # Python driver. See examples/mcp/ci_smoke.py for the assertion list
  # and docs/MCP_ADAPTER.md §5 for the response-shape contract.
  #
  # This job is NOT yet bound to branch protection. Adding it to the
  # required-check set is a separate ruleset edit per
  # docs/BRANCH_PROTECTION.md "Adding new required checks" section.
  # ──────────────────────────────────────────────────────────────────────
  mcp-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
        with: { key: mcp-smoke }
      - run: cargo build -p ncp-mcp-server --release --locked
      - run: python3 examples/mcp/ci_smoke.py

  # ──────────────────────────────────────────────────────────────────────
  # MCP SDK SMOKE JOB (issue #32): the same end-to-end stdio dialog that
  # ci_smoke.py validates with raw JSON-RPC, driven here through the
  # official MCP Python SDK (`mcp.ClientSession`). Catches regressions
  # that only surface via the SDK path: framing changes, protocol-version
  # negotiation drift, typed-model mismatches, and the rmcp
  # graceful-shutdown panic from issue #25 (which fires AFTER the last
  # response has been sent, so a dialog-only pass is NOT enough — the
  # script also asserts clean subprocess exit after stdin close).
  #
  # SDK PIN: `mcp==1.27.0` is pinned so an SDK release does not fail this
  # sentinel for reasons unrelated to NCP. Bump deliberately after
  # verifying the new version locally against the current server.
  #
  # ADVISORY (`continue-on-error: true`) initially. Promote to a required
  # check only after a few PRs prove stability, via the ruleset edit
  # described in docs/BRANCH_PROTECTION.md. The existing mcp-smoke job
  # (stdlib-only, no external deps) remains the required gate.
  # ──────────────────────────────────────────────────────────────────────
  mcp-sdk-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
        with: { key: mcp-sdk-smoke }
      - name: Install pinned MCP Python SDK
        run: python -m pip install "mcp==1.27.0"
      - name: Build ncp-mcp-server release binary
        run: cargo build -p ncp-mcp-server --release --locked
      - name: Run SDK smoke
        run: python examples/mcp/sdk_smoke.py

  # ──────────────────────────────────────────────────────────────────────
  # LANGGRAPH TEST JOB: builds the ncp-mcp-server release binary, installs
  # the ncp-langgraph Python package with its [dev] extras (ruff, mypy,
  # pytest, build, twine), and runs the package-local gates:
  #   - ruff check  (lint)
  #   - ruff format --check  (format gate)
  #   - mypy --strict src  (type gate)
  #   - pytest  (smoke tests; NCP_MCP_SERVER is exported for PR C+
  #     integration tests once they land)
  #   - python -m build + wheel py.typed check + twine check
  #     (verifies the PEP 561 marker survives the wheel build and
  #     that PyPI metadata + README render correctly)
  #
  # Every Python tool is invoked via `python -m <tool>` so it binds to
  # the interpreter set up by actions/setup-python@v5, not to whatever
  # the runner image's system Python ships on PATH. This prevents the
  # failure mode where a system-installed ruff/mypy/pytest silently runs
  # against the wrong site-packages.
  #
  # Python is PINNED to 3.10 via actions/setup-python@v5 so the
  # `requires-python = ">=3.10"` claim in pyproject.toml is tested at
  # the floor of the supported range, not at whatever the runner image
  # ships by default.
  #
  # ADVISORY ONLY in PR B. This job becomes a required check only AFTER
  # Phase 3A.3 PR G merges (per docs/BRANCH_PROTECTION.md "Adding new
  # required checks"). Until then, future PRs can technically merge with
  # langgraph-test failing.
  # ──────────────────────────────────────────────────────────────────────
  langgraph-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v2
        with: { key: langgraph-test }
      - name: Build ncp-mcp-server release binary
        run: cargo build -p ncp-mcp-server --release --locked
      - name: Install ncp-langgraph with [dev] extras
        working-directory: python/ncp-langgraph
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff check)
        working-directory: python/ncp-langgraph
        run: python -m ruff check .
      - name: Format check (ruff format)
        working-directory: python/ncp-langgraph
        run: python -m ruff format --check .
      - name: Type check (mypy --strict over src/)
        working-directory: python/ncp-langgraph
        run: python -m mypy --strict src
      - name: Pytest
        working-directory: python/ncp-langgraph
        env:
          NCP_MCP_SERVER: ${{ github.workspace }}/target/release/ncp-mcp-server
        run: python -m pytest
      - name: Build wheel + verify py.typed marker + twine check
        working-directory: python/ncp-langgraph
        run: |
          rm -rf dist/
          python -m build
          python -c "import zipfile, pathlib; w=next(pathlib.Path('dist').glob('*.whl')); names=set(zipfile.ZipFile(w).namelist()); assert 'ncp_langgraph/py.typed' in names, names; print('py.typed present in wheel')"
          python -m twine check dist/*

  # ──────────────────────────────────────────────────────────────────────
  # PYTHON-SDK-TEST JOB (Phase 3A.4-2): builds the ncp-runtime release
  # binary and runs the full ncp-runtime Python SDK gates on Linux,
  # macOS, and Windows:
  #   - ruff check  (lint)
  #   - ruff format --check  (format gate)
  #   - mypy --strict src  (type gate)
  #   - pytest  (full suite including integration tests gated on
  #     NCP_RUNTIME + real-subprocess hardening tests on all three
  #     platforms + the isolated-wheel-install demo smoke)
  #   - python -m build + wheel py.typed check + twine check
  #     (verifies the PEP 561 marker survives the wheel build and
  #     that PyPI metadata + README render correctly)
  #
  # NCP_RUNTIME points to the just-built release binary; the test
  # suite's conftest.py reads this env var to gate integration tests
  # that need a real `ncp` subprocess. Binary filename differs by OS
  # (ncp.exe on Windows), handled via the matrix conditional in the
  # Pytest step's env block.
  #
  # Every Python tool is invoked via `python -m <tool>` so it binds
  # to the interpreter set up by actions/setup-python@v5, not to
  # whatever system Python the runner image ships on PATH.
  #
  # Python is PINNED to 3.10 so the `requires-python = ">=3.10"`
  # claim in pyproject.toml is tested at the floor of the supported
  # range, not at whatever the runner image ships by default.
  #
  # ADVISORY ONLY in PR 2 (Phase 3A.4-2): not in the branch-protection
  # required-check set yet. Promotion to a required check happens
  # out-of-band after PR 4 (publish) merges, per
  # docs/BRANCH_PROTECTION.md "Adding new required checks".
  # ──────────────────────────────────────────────────────────────────────
  python-sdk-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-sdk-test-${{ matrix.os }}
      - name: Build ncp runtime release binary
        run: cargo build -p ncp-runtime --release --locked
      - name: Install ncp-runtime SDK with [dev] extras
        working-directory: python/ncp-runtime
        run: python -m pip install -e '.[dev]'
      - name: Lint (ruff check)
        working-directory: python/ncp-runtime
        run: python -m ruff check .
      - name: Format check (ruff format)
        working-directory: python/ncp-runtime
        run: python -m ruff format --check .
      - name: Type check (mypy --strict over src/)
        working-directory: python/ncp-runtime
        run: python -m mypy --strict src
      - name: Pytest (full suite incl. integration + real-subprocess + wheel-install smoke)
        working-directory: python/ncp-runtime
        env:
          NCP_RUNTIME: ${{ github.workspace }}/target/release/ncp${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m pytest
      - name: Build wheel + sdist + verify py.typed + twine check
        working-directory: python/ncp-runtime
        shell: bash
        run: |
          rm -rf dist/
          python -m build
          python -c "import zipfile, pathlib; w=next(pathlib.Path('dist').glob('*.whl')); names=set(zipfile.ZipFile(w).namelist()); assert 'ncp_runtime/py.typed' in names, names; print('py.typed present in wheel')"
          python -m twine check dist/*

  # ──────────────────────────────────────────────────────────────────────
  # WASM JOB: build & lint the brick crates for wasm32-unknown-unknown.
  # Brick crates are LIBRARY targets that can only compile to WASM.
  # If you find yourself moving these into the host matrix, STOP — they
  # use core::arch::wasm32::* intrinsics and host compilation will fail.
  # ──────────────────────────────────────────────────────────────────────
  wasm-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with: { key: wasm }
      - run: cargo build -p ncp-echo --target wasm32-unknown-unknown --release --locked
      - run: cargo build -p ncp-classifier-stub --target wasm32-unknown-unknown --release --locked
      - run: cargo clippy -p ncp-echo --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo clippy -p ncp-classifier-stub --target wasm32-unknown-unknown --locked -- -D warnings
