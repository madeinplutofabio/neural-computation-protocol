#
# Company Profile Lookup brick.
# Deterministic offline URL normalization and lookup against three
# fictional company profiles. Invalid input produces Failure(INVALID_INPUT);
# valid unknown hosts produce Success with profile_found: false.

brick_id: org.ncp-examples.company-profile-lookup
version: 0.1.0
ncp_protocol_range: ">=0.2.0 <0.3.0"
required_runtime_features: []
status: active

artifact:
  format: wasm
  entrypoint: invoke
  digest: "sha256:ecc0b4e83061aae3ba6243aa3b7a248297af1d738b0154c6f752a52e10803d35"
  size_bytes: 30056

schemas:
  input: schemas/input.schema.json
  output: schemas/output.schema.json
  carry_state: null

limits:
  max_ms: 10
  max_mem_mb: 4
  max_output_bytes: 4096
  max_input_bytes: 65536

capabilities: []

determinism:
  mode: bit_exact

time_model: pure

carry_state_class: none
carry_state_transport: inline
carry_state_max_bytes: 0
carry_state_side_effects_schema: null

graph_ref_slots: []
