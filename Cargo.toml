[workspace]
members = [
  "runtime",
  "bricks/echo",
  "bricks/classifier-stub",
  "crates/ncp-mcp-server",
]
default-members = ["runtime"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.94"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
codegen-units = 1
