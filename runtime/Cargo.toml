[package]
name = "ncp-runtime"
version = "0.3.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "ncp"
description = "NCP reference runtime — composable, auditable WASM agent graphs"
repository = "https://github.com/madeinplutofabio/neural-computation-protocol"
homepage = "https://github.com/madeinplutofabio/neural-computation-protocol"
readme = "../README.md"
keywords = ["wasm", "agentic-ai", "graph", "deterministic", "ncp"]
categories = ["artificial-intelligence", "wasm", "command-line-utilities"]
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "LICENSE",
    "NOTICE",
]

[lib]
name = "ncp_runtime"
path = "src/lib.rs"

[[bin]]
name = "ncp"
path = "src/main.rs"

[[bin]]
name = "ncp-bench"
path = "src/bin/ncp-bench.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
minicbor = { version = "0.25", default-features = false, features = ["alloc"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
wasmtime = "=43.0.0"
