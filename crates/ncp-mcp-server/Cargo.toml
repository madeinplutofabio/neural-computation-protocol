[package]
name = "ncp-mcp-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP adapter for NCP — exposes auditable WASM Brick graphs as MCP tools"
repository = "https://github.com/madeinplutofabio/neural-computation-protocol"
homepage = "https://github.com/madeinplutofabio/neural-computation-protocol"
readme = "README.md"
keywords = ["mcp", "agentic-ai", "wasm", "ncp", "adapter"]
categories = ["artificial-intelligence", "command-line-utilities"]
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
]

[lib]
name = "ncp_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "ncp-mcp-server"
path = "src/main.rs"

[dependencies]
# Per docs/MCP_ADAPTER.md §9: version + path together. Cargo prefers `path`
# during workspace development; published crate uses the `version` requirement.
ncp-runtime = { version = "0.3.6", path = "../../runtime" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

# Pre-allocate trace IDs in the adapter so the SAME id is used for the
# trace file path (`<trace-dir>/<trace_id>.jsonl`) and the MCP `tools/call`
# response. `ExecutionReport` does not echo the runtime-generated trace id
# back, so the adapter must own the value before execution. v4 (random)
# suffices — no need for v7/timestamp ordering in v0.
uuid = { version = "1", features = ["v4"] }

# MCP stdio protocol layer (PR C). Per docs/MCP_ADAPTER.md §10 SDK verification:
# rmcp v1.7 with default-features = false excludes compile-time tool macros so
# runtime-loaded graphs can be exposed through a manual ServerHandler.
rmcp = { version = "1.7", default-features = false, features = ["server", "transport-io"] }

# Tokio runtime for the MCP server.
# - rt-multi-thread: built manually in cli.rs; --check exits before this runtime
#   is constructed.
# - io-std: explicit because the stdio transport path depends on async stdio.
# - time: rmcp's graceful-shutdown drain path (rmcp/src/service.rs:1061) uses
#   `tokio::time::timeout` to bound the drain. Without the time driver enabled
#   on the runtime, the server panics on stdin EOF. Caught by the Phase 3A.2-E
#   real-host validation gate against the MCP Python SDK; CI smoke previously
#   masked it because tests/mcp_protocol.rs kills the subprocess instead of
#   closing stdin gracefully. Declared as a direct dep here so any future
#   reader can see why the time driver is required, even though rmcp pulls
#   the feature transitively.
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "time"] }

[dev-dependencies]
# Test-only async support. Keep macros out of the published runtime dependency
# surface; tests can still use #[tokio::test]. `process` and `io-util` are
# needed by tests/mcp_protocol.rs for subprocess spawning + stdio framing.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
